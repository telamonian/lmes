syntax = "proto2";
package lm.input;

import "lm/input/OutputOptions.proto";
import "lm/input/Tiling.proto";

message FFluxStage {
    enum StopCondition {
        TRAJECTORY_COUNT=0;
        FORWARD_FLUXES=1;
        TIME=2;
    }

    optional lm.input.tiling tiling = 1;
    optional bool reversed          = 2 [default=false];

    /*
     * - Stopping conditions for each forward flux phase. Can be specified one of two ways (an error will be raised if more than one way is used)
     *     - (default) If precisionGoal is specified, the phase limits are determined automatically
     *     - A list of phase limits of length equal to the total number of phases in the simulation (ie the number of interfaces in all the tilings used)
     */
    repeated lm.input.FFluxPhaseLimits fflux_phase_limits = 3;

    optional FFluxStage pilot_stage = 7;

    optional lm.input.OutputOptions output_options = 100;
}