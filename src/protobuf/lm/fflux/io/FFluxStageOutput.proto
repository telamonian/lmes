syntax = "proto2";
package lm.fflux.io;

import "lm/fflux/input/FFluxStage.proto";

message FFluxStageOutput {
    /*
     * - fflux_stage is needed for metadata purposes
     */
    optional lm.fflux.input.FFluxStage fflux_stage              = 201;

    /*
     * - First passage times with respect to tiling edge i
     *     - If your tiling sorts descending (ie edge[i] < edge[i+1]), these results may be slightly different from those obtained from replicate sampling due to boundary conditions
     */
    repeated double first_passage_times = 1 [packed=true];

    /*
     * - If costs, fluxes, etc are set, there should be as many entries in each as there are interfaces in fflux_stage's tiling
     */
    repeated double costs               = 11 [packed=true];
    repeated double fluxes              = 12 [packed=true];
    repeated double probabilities       = 13 [packed=true];
    repeated double variances           = 14 [packed=true];

    /*
     * - If set, output the raw data used to calculate fluxes and proabilities
     */
    optional FFluxStageOutputRaw fflux_stage_output_raw         = 101;
}

message FFluxStageOutputSummary {
    /*
     * - First passage times with respect to tiling edge i
     *     - If your tiling sorts descending (ie edge[i] < edge[i+1]), these results may be slightly different from those obtained from replicate sampling due to boundary conditions
     */
    repeated double first_passage_times = 1 [packed=true];

    /*
     * - If costs, fluxes, etc are set, there should be as many entries in each as there are interfaces in fflux_stage's tiling
     */
    repeated double costs               = 11 [packed=true];
    repeated double fluxes              = 12 [packed=true];
    repeated double probabilities       = 13 [packed=true];
    repeated double variances           = 14 [packed=true];
}

message FFluxStageOutputRaw {
    repeated uint64 successful_trajectory_counts      = 1 [packed=true];
    repeated double successful_trajectory_total_times = 2 [packed=true];

    repeated uint64 failed_trajectory_counts          = 11 [packed=true];
    repeated double failed_trajectory_total_times     = 12 [packed=true];
}