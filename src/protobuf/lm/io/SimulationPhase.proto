package lm.io;

import "lm/io/OutputOptions.proto";
import "lm/io/TrajectoryLimits.proto";
import "lm/io/TrajectoryState.proto";

message SimulationPhase {
    enum TrajectorySource {
        TRAJECTORY_STATES=0;
        PREVIOUS_PHASE=1;
    }

    required uint64 id                                = 1;

    optional TrajectorySource trajectory_source       = 2 [default=TRAJECTORY_STATES];
    repeated lm.io.TrajectoryState trajectory_states  = 3;

    optional lm.io.TrajectoryLimits trajectory_limits = 4;

    optional lm.io.OutputOptions output_options       = 5;
}