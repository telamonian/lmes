syntax = "proto2";
package lm.io;

import "robertslab/pbuf/NDArray.proto";

message LimitTracking {
    required uint64 trajectory_id                           = 1;
    required int32 limit_id                                 = 2;

    /*
     * add_to_cme_state controls whether the limit tracking information is recorded in the
     */
    optional bool add_to_cme_state                          = 3 [default=true];
    /*
     * add_to_output controls whether
     */
    optional bool add_to_output                             = 4 [default=false];

    optional robertslab.pbuf.NDArray degree_advancements    = 3;
    optional robertslab.pbuf.NDArray order_parameter_values = 4;
    optional robertslab.pbuf.NDArray species_counts         = 5;
    optional robertslab.pbuf.NDArray times                  = 6;
}
