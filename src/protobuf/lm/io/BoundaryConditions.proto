package lm.io;

import "lm/io/ArrayOrdering.proto";

message BoundaryConditions {

    enum BoundaryConditionsType {
        PERIODIC                = 0;
        ABSORBING               = 1;
        REFLECTING              = 2;
        FIXED_CONCENTRATION     = 3;        // Fixed concentration at the boundary.
        FIXED_INPUT_FLUX        = 4;        // Fixed and unique input flux at each boundary.
    }    
    
    optional BoundaryConditionsType global              = 1;
    optional bool axis_specific_boundaries              = 2 [default=false];
    optional BoundaryConditionsType x_plus              = 3;
    optional BoundaryConditionsType x_minus             = 4;
    optional BoundaryConditionsType y_plus              = 5;
    optional BoundaryConditionsType y_minus             = 6;
    optional BoundaryConditionsType z_plus              = 7;
    optional BoundaryConditionsType z_minus             = 8;
    
    // Parameters for FIXED_CONCENTRATION and FIXED_INPUT_FLUX.
    optional int32 boundary_species                     = 9;
    
    // Parameters for FIXED_CONCENTRATION.
    optional double boundary_concentration              = 10;
    
    // Parameters for FIXED_INPUT_FLUX.
    optional int32 lattice_x_size                       = 11;
    optional int32 lattice_y_size                       = 12;
    optional int32 lattice_z_size                       = 13;
    optional ArrayOrdering boundary_input_flux_ordering = 14;
    repeated double boundary_input_flux                 = 15 [packed=true];
}