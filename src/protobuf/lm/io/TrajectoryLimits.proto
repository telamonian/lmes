package lm.io;

message TrajectoryLimits {
    enum LimitType {
        NONE=0;
        TIME=1;
        SPECIES=2;
        ORDER_PARAMETER=3;
        DEGREE_ADVANCEMENT=4;
    }

    enum StoppingCondition {
        option allow_alias = true;

        LESS_THAN=0;
        LESS_THAN_EQUAL_TO=1;
        GREATER_THAN=2;
        GREATER_THAN_EQUAL_TO=3;

        MIN=0;
        MAX=2;

        PREVIOUS_LT_CURRENT_GEQ=4;
        PREVIOUS_LEQ_CURRENT_GT=5;
        PREVIOUS_GT_CURRENT_LEQ=6;
        PREVIOUS_GEQ_CURRENT_LT=7;

        INCREASING_OPEN=4;
        INCREASING_CLOSED=5;
        DECREASING_OPEN=6;
        DECREASING_CLOSED=7;
    }

    message TrajectoryLimit {
        required LimitType limit_type                   = 1;
        required StoppingCondition stopping_condition   = 2;

        optional uint32 value_id                        = 3;
        oneof value_oneof {
            double dvalue                               = 4;
            int32 ivalue                                = 5;
            uint64 uvalue                               = 6;
        }
    }

//    message TrajectoryLimit {
//        required ValueType limit_type                   = 1;
//        required StoppingCondition stopping_condition   = 2;
//
//        oneof id_oneof {
//            uint32 order_parameter_id                   = 3;
//            uint32 reaction_id                          = 4;
//            uint32 species_id                           = 5;
//        }
//
//        oneof value_oneof {
//            uint64 degree_advancement_count             = 6;
//            double order_parameter_value                = 7;
//            int32 species_count                         = 8;
//            double time                                 = 9;
//        }
//    }

    repeated TrajectoryLimit trajectory_limits          = 1;
    optional TrajectoryLimit time_limit                 = 2;
}