package lm.io;

message FFluxParameters {

    // enumerated type that represent whether an interface is ordered ("arranged") highest-to-lowest or lowest-to-highest.
    // the actual order that the interface is used in during a simulation also depends on the FFluxTrajectoryList object's direction attribute
    enum arrangement {
        DECREASING = 0;
        INCREASING = 1;
    }

    message OrderParameter {
        required uint32 type                     = 1;
        required uint32 id                       = 2;
        repeated uint32 species_id               = 3 [packed=true];
        repeated double species_coefficient      = 4 [packed=true];
    }

    message Interface {
        repeated uint32 order_parameter_id       = 1 [packed=true];
        repeated double bin_border               = 2 [packed=true];
        required arrangement arrangement         = 3;
    }

    repeated OrderParameter order_parameter      = 1;
    repeated Interface interface                 = 2;
}
