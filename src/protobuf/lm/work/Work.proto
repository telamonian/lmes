#include "lm/work/ReadOnly.proto"
#include "lm/work/ReadWrite.proto"
package lm.work;

message Work {
	optional uint32 tid 				= 1;
	optional unit32 pid					= 2;
	optional uint32 sid					= 3;
	
	enum JobType {
		REPLICATE = 0;
		FFS1 = 1;
		FFS2 = 2;
	}
	
	enum SolverType {
		CME = 0;
		RDME = 1;
	}
	
	optional JobType jobType			= 4;
	optional SolverType solverType		= 5;
	optional uint32 ffs2Interface		= 6;
	optional double wallClockTime		= 7;
	optional lm.io.ReadOnly readOnly 	= 8;
	optional lm.io.ReadWrite readWrite	= 9;
}