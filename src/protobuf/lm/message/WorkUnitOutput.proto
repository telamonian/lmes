package lm.message;

import "lm/io/ConcentrationsTimeSeries.proto";
import "lm/io/DegreeAdvancementTimeSeries.proto";
import "lm/io/FFluxOutput.proto";
import "lm/io/FirstPassageTimes.proto";
import "lm/io/LatticeTimeSeries.proto";
import "lm/io/OrderParameterTimeSeries.proto";
import "lm/io/SpeciesCounts.proto";
import "lm/io/SpeciesTimeSeries.proto";

message WorkUnitOutput {
        optional bool has_output                                                    = 1 [default=false];
        optional lm.io.ConcentrationsTimeSeries concentrations_time_series          = 2;
        optional lm.io.DegreeAdvancementTimeSeries degree_advancement_time_series   = 3;
        optional lm.io.FFluxOutput fflux_output                                     = 4;
        repeated lm.io.FirstPassageTimes first_passage_times                        = 5;
        optional lm.io.LatticeTimeSeries lattice_time_series                        = 6;
        optional lm.io.OrderParameterTimeSeries order_parameter_time_series         = 7;
        optional lm.io.SpeciesTimeSeries species_time_series                        = 8;
}
