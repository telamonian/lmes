syntax = "proto2";
package lm.input;

message OutputOptions {
    optional string record_name_prefix = 1;
    optional bool condense_output = 2 [default=false];

    optional double degree_advancement_write_interval = 11;
    optional double lattice_write_interval            = 12;
    optional double order_parameter_write_interval    = 13;
    optional double species_write_interval            = 14;

    //    repeated uint32 da_reactions_to_track  = 21;
    repeated uint32 fpt_species_to_track         = 22;
    repeated uint32 fpt_order_parameter_to_track = 23;

    optional bool output_initial_state = 31 [default = true];
    optional bool output_final_state   = 32 [default = true];
}