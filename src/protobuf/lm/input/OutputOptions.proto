syntax = "proto2";
package lm.input;

message OutputOptions {
    optional string record_name_prefix = 1;
    optional bool condense_output      = 2 [default=false];

    optional bool write_initial_trajectory_state = 11 [default = true];
    optional bool write_final_trajectory_state   = 12 [default = true];
    optional bool write_limit_tracking           = 13 [default = false];

    optional double concentrations_write_interval     = 21;
    optional double degree_advancement_write_interval = 22;
    optional double lattice_write_interval            = 23;
    optional double order_parameter_write_interval    = 24;
    optional double species_write_interval            = 25;

    //    repeated uint32 da_reactions_to_track  = 31;
    repeated uint32 fpt_species_to_track         = 32;
    repeated uint32 fpt_order_parameter_to_track = 33;
}
