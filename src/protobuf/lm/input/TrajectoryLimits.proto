syntax = "proto2";
package lm.input;

message TrajectoryLimit {
    enum LimitType {
        NONE=0;
        TIME=1;
        SPECIES=2;
        ORDER_PARAMETER=3;
        DEGREE_ADVANCEMENT=4;
    }

    enum StoppingCondition {
        MIN=0;
        MAX=1;
        DECREASING=2;
        INCREASING=3;
    }

    optional int32 id                               = 2 [default=-2];

    /*
     * - stopping_condition is used in conjunction with include_endpoint to determine the function that is evaluated when this limit is checked
     *     - The function is chosen according to the table below:
     *
     *         | stopping_condition |                include_endpoint==false               |                include_endpoint==true                |
     *         |--------------------|:----------------------------------------------------:|:----------------------------------------------------:|
     *         | MIN                |                  value < limit_value                 |                 value <= limit_value                 |
     *         | MAX                |                  value > limit_value                 |                 value >= limit_value                 |
     *         | DECREASING         | previous_value > limit_value && value <= limit_value | previous_value >= limit_value && value < limit_value |
     *         | INCREASING         | previous_value < limit_value && value >= limit_value | previous_value <= limit_value && value > limit_value |
     */
    required StoppingCondition stopping_condition   = 3;
    optional bool include_endpoint                  = 4 [default=true];

    /*
     * - limit_type is used in conjunction with value_id to determine what simulation value will be checked when the limit is invoked
     *     - limit_type==TIME: value_id is not used for time limits
     *     - limit_type==SPECIES: value_id is the index of the species count checked
     *     - limit_type==ORDER_PARAMETER: value_id is the id of the order parameter value checked
     *     - limit_type==DEGREE_ADVANCEMENT: value_id is the index of the reaction count checked
     */
    required LimitType limit_type                   = 1;
    optional uint32 value_id                        = 5;

    optional double dvalue                          = 6 [default=0.0];
    optional int32 ivalue                           = 7 [default=0];
    optional uint64 uvalue                          = 8 [default=0];

    /*
     * - If terminating is false, the limit will never signal for termination (overrides other options, such as count)
     */
    optional bool terminating                       = 9 [default=true];

    /*
     * - If count is set, the limit won't signal for termination until it has been crossed a number of times equal to count
     */
    optional uint64 count                           = 10;

    /*
     * - If track, the limit will record the system state every time it is crossed
     *     - The track option makes the limit states available to Lattice Microbes internally. There is a separate output_at_limits option in OutputOptions.proto to control writing the limit states to a file
     */
    optional bool track                             = 11 [default=false];
}

message TrajectoryLimits {
    repeated TrajectoryLimit trajectory_limits          = 1;
    optional TrajectoryLimit time_limit                 = 2;
}